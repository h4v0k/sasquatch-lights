name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package.json', 'app.json') }}
          restore-keys: gradle-

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Use the fixed sideload signing key
        # Release builds from prebuild sign with android/app/debug.keystore. Using the same key every build
        # lets a new APK install over the old one without losing saved modes. Sideload only; never a store key.
        run: cp ci/sideload.keystore android/app/debug.keystore

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/sasquatch-lights.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: sasquatch-lights-apk
          path: dist/sasquatch-lights.apk
          retention-days: 14

      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Latest build of main (${GITHUB_SHA::7}). On the Android phone: download sasquatch-lights.apk and open it (allow installs from your browser once)."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --notes "$NOTES"
          else
            gh release create android-latest --prerelease --title "Android (latest)" --notes "$NOTES"
          fi
          gh release upload android-latest dist/sasquatch-lights.apk --clobber
