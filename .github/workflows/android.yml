name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CI_LOG: ${{ github.workspace }}/../ci.log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package.json', 'app.json') }}
          restore-keys: gradle-

      - name: Install
        run: |
          set -o pipefail
          { npm install --no-audit --no-fund --legacy-peer-deps && npx expo install --fix -- --legacy-peer-deps; } 2>&1 | tee -a "$CI_LOG"

      - name: Typecheck
        run: set -o pipefail; npm run typecheck 2>&1 | tee -a "$CI_LOG"

      - name: Unit tests
        run: set -o pipefail; npm test -- --ci 2>&1 | tee -a "$CI_LOG"

      - name: Generate the Android project
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: set -o pipefail; npx expo prebuild --platform android --no-install 2>&1 | tee -a "$CI_LOG"

      - name: Use the fixed sideload signing key
        # Release builds from prebuild sign with android/app/debug.keystore. Using the same key every build
        # lets a new APK install over the old one without losing saved modes. Sideload only; never a store key.
        run: cp ci/sideload.keystore android/app/debug.keystore

      - name: Build release APK
        working-directory: android
        run: set -o pipefail; ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee -a "$CI_LOG"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/sasquatch-lights.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: sasquatch-lights-apk
          path: dist/sasquatch-lights.apk
          retention-days: 14

      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Latest build of main (${GITHUB_SHA::7}). On the Android phone: download sasquatch-lights.apk and open it (allow installs from your browser once)."
          # Move the tag to this commit so the release always matches the APK.
          git tag -f android-latest "$GITHUB_SHA"
          git push -f origin refs/tags/android-latest
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create android-latest --prerelease --title "Android (latest)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload android-latest dist/sasquatch-lights.apk --clobber

      - name: Report failure as an annotation
        # Lets tools that can only reach the GitHub API read why the build failed.
        if: failure()
        run: |
          tail -c 60000 "$CI_LOG" 2>/dev/null | grep -i -E -B2 -A8 'error|failed|ERESOLVE|notarget|exception|what went wrong' | tail -n 120 > err.txt || true
          [ -s err.txt ] || tail -n 80 "$CI_LOG" > err.txt || true
          body=$(sed -e 's/%/%25/g' err.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build failed::${body:0:60000}"
